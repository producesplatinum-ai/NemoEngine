name: ChatGPT runtime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2

      - name: Initialize evidence artifact
        run: |
          if find audit/nemo-static-evidence -mindepth 1 ! -type f ! -type d -print -quit | grep -q .; then
            echo 'Evidence input contains a symlink or non-regular entry.' >&2
            exit 1
          fi
          mkdir -p \
            "$RUNNER_TEMP/nemo-evidence/inputs" \
            "$RUNNER_TEMP/nemo-evidence/implementation" \
            "$RUNNER_TEMP/nemo-evidence/logs" \
            "$RUNNER_TEMP/nemo-evidence/reproduction" \
            "$RUNNER_TEMP/nemo-evidence/status"
          cp -R audit/nemo-static-evidence "$RUNNER_TEMP/nemo-evidence/inputs/audit"
          cp scripts/verify-nemo-fidelity.mjs \
            scripts/verify-nemo-fidelity-dynamic.mjs \
            scripts/test-nemo-fidelity-verifier.mjs \
            scripts/summarize-nemo-evidence-ci.mjs \
            "$RUNNER_TEMP/nemo-evidence/implementation/"
          cp .github/workflows/chatgpt-runtime.yml \
            "$RUNNER_TEMP/nemo-evidence/implementation/"
          cp --parents -R \
            'Nemo Engine/Connector Readable/11.5.2 General RP' \
            'Nemo Engine/Nemo Engine 11.5.2 - General RP.json' \
            'Nemo Engine/Ready/Nemo Engine 11.5.2 - Ready RU Psychology Humiliation JOI RP.json' \
            'Nemo Engine/tools/build-connector-readable-11.5.2.mjs' \
            scripts/nemo-chatgpt-runtime.mjs \
            scripts/test-nemo-chatgpt-runtime.mjs \
            scripts/nemo-chatgpt-executor.mjs \
            scripts/test-nemo-chatgpt-executor.mjs \
            "$RUNNER_TEMP/nemo-evidence/reproduction/"
          git rev-parse HEAD > "$RUNNER_TEMP/nemo-evidence/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/nemo-evidence/tree.txt"
          node --version > "$RUNNER_TEMP/nemo-evidence/node-version.txt"
          git bundle create \
            "$RUNNER_TEMP/nemo-evidence/reproduction/repository.bundle" \
            HEAD b988a06eedb24b916182d0b5d545eb9a2dbabe02
          node --input-type=module > "$RUNNER_TEMP/nemo-evidence/runner-environment.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          import os from 'node:os';

          const environment = {
            schemaVersion: 'nemo-runner-environment/v1',
            imageOS: process.env.ImageOS ?? null,
            imageVersion: process.env.ImageVersion ?? null,
            runnerOS: process.env.RUNNER_OS ?? null,
            runnerArch: process.env.RUNNER_ARCH ?? null,
            nodeVersion: process.version,
            platform: process.platform,
            architecture: process.arch,
            kernelRelease: os.release(),
            kernelVersion: os.version(),
            osRelease: readFileSync('/etc/os-release', 'utf8'),
            runnerImageImmutable: false,
          };
          process.stdout.write(`${JSON.stringify(environment, null, 2)}\n`);
          NODE

      - name: Reassemble canonical preset
        run: |
          set +e
          node 'Nemo Engine/Connector Readable/11.5.2 General RP/reassemble.mjs' \
            2>&1 | tee "$RUNNER_TEMP/nemo-evidence/logs/reassembly.log"
          codes=("${PIPESTATUS[@]}")
          printf '%s\n' "${codes[0]}" > "$RUNNER_TEMP/nemo-evidence/status/reassembly.exit"
          printf '%s\n' "${codes[1]}" > "$RUNNER_TEMP/nemo-evidence/status/reassembly.logger.exit"
          if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
          exit "${codes[1]}"

      - name: Verify connector-readable mirror
        if: ${{ always() }}
        run: |
          set +e
          node 'Nemo Engine/tools/build-connector-readable-11.5.2.mjs' --check \
            2>&1 | tee "$RUNNER_TEMP/nemo-evidence/logs/connector-mirror.log"
          codes=("${PIPESTATUS[@]}")
          printf '%s\n' "${codes[0]}" > "$RUNNER_TEMP/nemo-evidence/status/connector-mirror.exit"
          printf '%s\n' "${codes[1]}" > "$RUNNER_TEMP/nemo-evidence/status/connector-mirror.logger.exit"
          if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
          exit "${codes[1]}"

      - name: Verify structural fidelity evidence
        if: ${{ always() }}
        run: |
          set +e
          node scripts/verify-nemo-fidelity.mjs \
            --out "$RUNNER_TEMP/nemo-evidence/structural-verification.json" \
            2>&1 | tee "$RUNNER_TEMP/nemo-evidence/logs/structural.log"
          codes=("${PIPESTATUS[@]}")
          printf '%s\n' "${codes[0]}" > "$RUNNER_TEMP/nemo-evidence/status/structural.exit"
          printf '%s\n' "${codes[1]}" > "$RUNNER_TEMP/nemo-evidence/status/structural.logger.exit"
          if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
          exit "${codes[1]}"

      - name: Verify executable fidelity cases
        if: ${{ always() }}
        run: |
          set +e
          node scripts/verify-nemo-fidelity-dynamic.mjs \
            --out "$RUNNER_TEMP/nemo-evidence/dynamic-verification.json" \
            2>&1 | tee "$RUNNER_TEMP/nemo-evidence/logs/dynamic.log"
          codes=("${PIPESTATUS[@]}")
          printf '%s\n' "${codes[0]}" > "$RUNNER_TEMP/nemo-evidence/status/dynamic.exit"
          printf '%s\n' "${codes[1]}" > "$RUNNER_TEMP/nemo-evidence/status/dynamic.logger.exit"
          if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
          exit "${codes[1]}"

      - name: Negative-test fidelity verifier
        if: ${{ always() }}
        run: |
          set +e
          node --test scripts/test-nemo-fidelity-verifier.mjs \
            2>&1 | tee "$RUNNER_TEMP/nemo-evidence/logs/negative.tap"
          codes=("${PIPESTATUS[@]}")
          printf '%s\n' "${codes[0]}" > "$RUNNER_TEMP/nemo-evidence/status/negative.exit"
          printf '%s\n' "${codes[1]}" > "$RUNNER_TEMP/nemo-evidence/status/negative.logger.exit"
          if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
          exit "${codes[1]}"

      - name: Verify offline replay bundle
        if: ${{ always() }}
        run: |
          set +e
          (
            set -euo pipefail
            bundle="$RUNNER_TEMP/nemo-evidence/reproduction/repository.bundle"
            replay="$RUNNER_TEMP/nemo-evidence-replay"
            git bundle verify "$bundle"
            git clone --quiet "$bundle" "$replay"
            expected=$(tr -d '\n' < "$RUNNER_TEMP/nemo-evidence/commit.txt")
            actual=$(git -C "$replay" rev-parse HEAD)
            test "$actual" = "$expected"
            git -C "$replay" cat-file -e \
              'b988a06eedb24b916182d0b5d545eb9a2dbabe02^{commit}'
            printf 'Audited ref %s present.\n' \
              'b988a06eedb24b916182d0b5d545eb9a2dbabe02'
            node "$replay/scripts/verify-nemo-fidelity.mjs" \
              --out "$RUNNER_TEMP/nemo-replay-structural.json"
            test -z "$(git -C "$replay" status --porcelain=v1)"
            printf 'Replay bundle verified at %s.\n' "$actual"
          ) 2>&1 | tee "$RUNNER_TEMP/nemo-evidence/logs/replay-bundle.log"
          codes=("${PIPESTATUS[@]}")
          printf '%s\n' "${codes[0]}" > "$RUNNER_TEMP/nemo-evidence/status/replay-bundle.exit"
          printf '%s\n' "${codes[1]}" > "$RUNNER_TEMP/nemo-evidence/status/replay-bundle.logger.exit"
          if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
          exit "${codes[1]}"

      - name: Test ChatGPT runtime adapter
        if: ${{ always() }}
        run: |
          set +e
          node --test scripts/test-nemo-chatgpt-runtime.mjs \
            2>&1 | tee "$RUNNER_TEMP/nemo-evidence/logs/runtime.tap"
          codes=("${PIPESTATUS[@]}")
          printf '%s\n' "${codes[0]}" > "$RUNNER_TEMP/nemo-evidence/status/runtime.exit"
          printf '%s\n' "${codes[1]}" > "$RUNNER_TEMP/nemo-evidence/status/runtime.logger.exit"
          if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
          exit "${codes[1]}"

      - name: Test verified ChatGPT executor
        if: ${{ always() }}
        run: |
          set +e
          node --test scripts/test-nemo-chatgpt-executor.mjs \
            2>&1 | tee "$RUNNER_TEMP/nemo-evidence/logs/executor.tap"
          codes=("${PIPESTATUS[@]}")
          printf '%s\n' "${codes[0]}" > "$RUNNER_TEMP/nemo-evidence/status/executor.exit"
          printf '%s\n' "${codes[1]}" > "$RUNNER_TEMP/nemo-evidence/status/executor.logger.exit"
          if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
          exit "${codes[1]}"

      - name: Summarize complete evidence run
        if: ${{ always() }}
        run: |
          set +e
          node scripts/summarize-nemo-evidence-ci.mjs \
            --evidence-dir "$RUNNER_TEMP/nemo-evidence" \
            > "$RUNNER_TEMP/nemo-evidence/logs/summary.log" 2>&1
          code=$?
          sed -n '1,240p' "$RUNNER_TEMP/nemo-evidence/logs/summary.log"
          exit "$code"

      - name: Write artifact checksums
        if: ${{ always() }}
        run: |
          cd "$RUNNER_TEMP/nemo-evidence"
          if find . -mindepth 1 ! -type f ! -type d -print -quit | grep -q .; then
            echo 'Evidence artifact contains a symlink or non-regular entry.' >&2
            exit 1
          fi
          find . -type f ! -name SHA256SUMS -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Upload evidence artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nemo-fidelity-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/nemo-evidence/
          if-no-files-found: error
          retention-days: 90
