name: SillyTavern Darya seeder

on:
  push:
    branches:
      - feat/darya-sillytavern-bundle
      - feat/sillytavern-full-cloud
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Test Darya seeder
        run: node --test sillytavern-cloud/test-seed-darya.mjs
